services:
  c2pa-veritas:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: ${VITE_API_KEY:-changeme}
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - backend/.env
    environment:
      # Force these under /app/data regardless of what backend/.env sets —
      # env_file values would otherwise override the image's own correct
      # defaults, since backend/.env.example's relative-path default is
      # meant for local (non-Docker) development, not this container.
      AUDIT_DB_PATH: /app/data/audit_log.db
      TRUST_LIST_CACHE_PATH: /app/data/trust_list_cache.pem
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
